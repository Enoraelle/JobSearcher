[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsearcher"
dynamic = ["version"]
description = "Command-line tool to collect, store, score, and export job postings from multiple sources."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nathanaelle Wong", email = "nathanaellewong@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jobsearcher = "jobsearcher.cli:main"

[tool.hatch.version]
path = "src/jobsearcher/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jobsearcher"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the example config as package data so `jobsearcher init` works from a
# plain `pip install`, not only from a source checkout. Loaded via
# importlib.resources; see jobsearcher.config.example_config_text.
"src/jobsearcher/config.example.yaml" = "jobsearcher/config.example.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["jobsearcher"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jobsearcher"]

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov-fail-under is set just under the coverage the suite currently
# reaches (96%), so a change that stops covering what is covered today fails
# CI instead of being noticed months later. The point is the ratchet, not
# the number: raise it when the suite earns it.
addopts = "--cov=jobsearcher --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["src/jobsearcher"]

# Example JobSearcher configuration.
#
# This file ships inside the installed package. Run `jobsearcher init` to
# copy it to config.yaml in the current directory, then adjust it to your
# own profile. config.yaml is gitignored because it holds personal data.
#
# As shipped, this file runs end to end with no API key and no editing:
# `jobsearcher run` collects from We Work Remotely's public feed, scores
# every posting offline against the profile below, and writes digest.md.
# Edit the profile so the scores mean something for you, then enable more
# sources.

search:
  # Title filters applied while collecting (case-insensitive substring).
  # An excluded term anywhere in the title drops the posting. If any
  # include terms are set, at least one must appear; with none set, every
  # non-excluded title passes.
  title_keywords_include: []
  title_keywords_exclude:
    - senior
    - staff
    - principal

  # NOT a collection filter. Nothing is dropped while fetching: every
  # posting is tagged with a best-effort detected language (fr/en/de/es, or
  # blank when undetermined) and this list is only the default filter
  # `jobsearcher list` applies at display time. Override it per run with
  # `--language <code>` or see everything with `--language all`; postings
  # whose language could not be determined are never hidden.
  languages:
    - en

profile:
  # `role` is the only required field in this file.
  role: "Python/Django Backend Developer"
  skills:
    - python
    - django
    - django rest framework
    - postgresql
    - celery
    - docker
    - rest apis
  absent_skills:
    - php
    - symfony
  experience_years: 3
  work_mode: remote
  locations:
    - France
    - Remote - EU

sources:
  # RSS feed source (see sources/weworkremotely.py). Enabled by default and
  # needs no configuration: with no `feeds` set it reads the site-wide
  # "remote-jobs" feed. Any other entry is treated as a We Work Remotely
  # category slug and fetched from its own feed
  # (https://weworkremotely.com/categories/<slug>.rss).
  weworkremotely:
    enabled: true
    feeds:
      - remote-jobs
      - remote-programming-jobs
    # Off by default: fetching every posting's own page (one extra request
    # per posting, on top of the feed requests) to get its full description
    # instead of the RSS feed's truncated one.
    fetch_full_description: false
    max_postings_per_feed: 50

  # JSON API source (see sources/greenhouse.py). One request per configured
  # company slug against Greenhouse's public, unauthenticated Job Board API.
  # Disabled until you list the companies you care about: the slug is the
  # last path segment of a company's Greenhouse board URL
  # (boards.greenhouse.io/<slug>).
  greenhouse:
    enabled: false
    companies:
      - example-company

  # HTML-scraping source (see sources/freework.py). One search request per
  # configured keyword against free-work.com's tech/IT job search. This is
  # the fragile shape: free-work.com publishes no API contract, so a site
  # redesign can break the selectors this source depends on — see that
  # module's docstring for how such a failure is surfaced. Disabled by
  # default.
  freework:
    enabled: false
    keywords:
      - "python django"
      - "développeur backend"
    max_postings_per_keyword: 50

storage:
  backend: sqlite
  path: "./jobsearcher.db"

scoring:
  # Offline, deterministic, no API key. The score is skill coverage only:
  # the share of `profile.skills` the posting mentions, minus a penalty for
  # each `profile.absent_skills` entry it mentions. Location and work-mode
  # fit are reported next to the score, not folded into it.
  backend: keyword_match
  # Optional. Each list is an equivalence class: any member matches text
  # containing any other. Matching is already case-, accent- and
  # punctuation-insensitive, so only add genuinely different spellings.
  synonyms:
    - [postgresql, postgres, psql]
    - [rest apis, rest api, restful]
    - [kubernetes, k8s]
  # Subtracted from coverage (0-1 scale) per matched absent skill, capped.
  # Default 0.34 ≈ three ruled-out skills in one posting zero the score.
  absent_skill_penalty: 0.34
  absent_skill_penalty_cap: 1.0

  # Bonus, opt-in, requires `pip install "jobsearcher[llm]"` and an API key
  # in the environment (never in this file). Talks to any OpenAI-compatible
  # endpoint. Replace the block above with this one to use it.
  # backend: llm
  # base_url: "https://api.openai.com/v1"
  # model: "gpt-4o-mini"
  # api_key_env: "OPENAI_API_KEY"
  # max_postings_per_run: 25

exporters:
  # Offline file formats, standard library only. Each needs an
  # `output_path`. Postings are written sorted by score, highest first. The
  # Markdown file is meant to be read by a person: one bullet per posting
  # with a link, and the posting's geographic eligibility restrictions
  # shown when it has any.
  markdown:
    enabled: true
    output_path: "./digest.md"
  csv:
    enabled: false
    output_path: "./jobs.csv"
  json:
    enabled: false
    output_path: "./jobs.json"

  # Bonus, opt-in, requires `pip install "jobsearcher[notion]"`. Keeps one
  # database page per posting, matched by URL so re-exporting updates rather
  # than duplicates; the application status goes to a select property. The
  # integration token is read only from the environment variable named by
  # `api_key_env` (never from this file). The database must already have the
  # properties below (types in parentheses); a missing or mistyped one is
  # reported with the exact property to create.
  notion:
    enabled: false
    database_id: "your-notion-database-id"
    api_key_env: "NOTION_API_KEY"
    # Property names, if yours differ from these defaults:
    # title_property: "Name"       # (title)
    # url_property: "URL"          # (url)   — the idempotency key
    # status_property: "Status"    # (select)
    # company_property: "Company"  # (rich text)
    # score_property: "Score"      # (number)
    # source_property: "Source"    # (select)

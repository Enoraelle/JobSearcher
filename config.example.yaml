# Example JobSearcher configuration.
#
# Copy this file to config.yaml and fill in your own profile — config.yaml is
# gitignored because it holds personal data, config.example.yaml is the only
# version tracked in the repository.

search:
  title_keywords_include:
    - "python developer"
    - "backend engineer"
    - "django"
  title_keywords_exclude:
    - "senior"
    - "staff"
    - "lead"
  languages:
    - en
    - fr

profile:
  role: "Python/Django Backend Developer"
  skills:
    - python
    - django
    - django rest framework
    - postgresql
    - celery
    - docker
    - rest apis
  absent_skills:
    - php
    - symfony
  experience_years: 3
  work_mode: remote
  locations:
    - France
    - Remote - EU

sources:
  linkedin:
    enabled: true
    query: "python django developer"
  indeed:
    enabled: false

  # JSON API source (see sources/greenhouse.py). One request per configured
  # company slug against Greenhouse's public, unauthenticated Job Board API.
  greenhouse:
    enabled: true
    companies:
      - some-company

  # RSS feed source (see sources/weworkremotely.py). "remote-jobs" is the
  # site-wide feed; any other entry is treated as a We Work Remotely
  # category slug and fetched from its own feed
  # (https://weworkremotely.com/categories/<slug>.rss).
  weworkremotely:
    enabled: true
    feeds:
      - remote-jobs
      - remote-programming-jobs
    # Off by default: fetching every posting's own page (one extra request
    # per posting, on top of the feed requests) to get its full description
    # instead of the RSS feed's truncated one. Turn on only with a
    # deliberately conservative min_request_interval configured for this
    # source, since it turns O(feeds) requests into O(postings) requests.
    fetch_full_description: false
    max_postings_per_feed: 50

  # HTML-scraping source (see sources/freework.py). One search request per
  # configured keyword against free-work.com's tech/IT job search. This is
  # the fragile shape: free-work.com publishes no API contract, so a site
  # redesign can break the selectors this source depends on — see that
  # module's docstring for how such a failure is surfaced.
  freework:
    enabled: true
    keywords:
      - "python django"
      - "développeur backend"
    max_postings_per_keyword: 50

storage:
  backend: sqlite
  path: "./jobsearcher.db"

scoring:
  # Offline, deterministic, no API key. The score is skill coverage only:
  # the share of `profile.skills` the posting mentions, minus a penalty for
  # each `profile.absent_skills` entry it mentions. Location and work-mode
  # fit are reported next to the score, not folded into it.
  backend: keyword_match
  # Optional. Each list is an equivalence class: any member matches text
  # containing any other. Matching is already case-, accent- and
  # punctuation-insensitive, so only add genuinely different spellings.
  synonyms:
    - [postgresql, postgres, psql]
    - [rest apis, rest api, restful]
    - [kubernetes, k8s]
  # Subtracted from coverage (0-1 scale) per matched absent skill, capped.
  # Default 0.34 ≈ three ruled-out skills in one posting zero the score.
  absent_skill_penalty: 0.34
  absent_skill_penalty_cap: 1.0

  # Bonus, opt-in, requires `pip install jobsearcher[llm]` and an API key in
  # the environment (never in this file). Talks to any OpenAI-compatible
  # endpoint. Uncomment to use it instead of keyword_match.
  # backend: llm
  # base_url: "https://api.openai.com/v1"
  # model: "gpt-4o-mini"
  # api_key_env: "OPENAI_API_KEY"
  # max_postings_per_run: 25

exporters:
  markdown_digest:
    enabled: true
    output_path: "./digest.md"
  notion:
    enabled: true
    database_id: "your-notion-database-id"
